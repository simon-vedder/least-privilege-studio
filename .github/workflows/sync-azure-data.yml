# .github/workflows/sync-azure-data.yml
#
# Runs weekly to pull the latest Azure built-in role definitions and provider
# operations (Azure RBAC) plus Entra ID directory roles + resource actions.
#
# Requirements:
#   - Azure Service Principal credentials stored as GitHub secrets:
#     AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   - Azure RBAC data: SP needs "Reader" on the subscription
#   - Entra data: SP needs Microsoft Graph application permission
#     RoleManagement.Read.Directory (or Directory.Read.All), admin-consented.
#     Without it, the Entra pull step fails and only Azure data is refreshed.
#
# The workflow:
#   1. Authenticates to Azure
#   2. Pulls Azure role definitions + provider operations, and Entra roles +
#      resource actions into data/raw/ (not committed)
#   3. Runs build-data.js and build-entra.js → processed files in public/data/
#   4. Commits changed public/data/ files (if any) to main

name: Sync Azure Data

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Pull built-in role definitions
        run: |
          mkdir -p data/raw
          echo "Pulling built-in role definitions..."
          az role definition list \
            --query "[?roleType=='BuiltInRole']" \
            --output json \
            > data/raw/roles-raw.json
          ROLE_COUNT=$(python3 -c "import json; print(len(json.load(open('data/raw/roles-raw.json'))))")
          echo "Pulled $ROLE_COUNT roles"

      - name: Pull provider operations
        run: |
          echo "Pulling provider operations..."
          az provider operation list \
            --output json \
            > data/raw/operations-raw.json
          OP_COUNT=$(python3 -c "
          import json
          data = json.load(open('data/raw/operations-raw.json'))
          total = sum(len(rt.get('operations', [])) for p in data for rt in p.get('resourceTypes', []))
          print(total)
          ")
          echo "Pulled $OP_COUNT operations"

      # Requires Graph app permission RoleManagement.Read.Directory on the SP.
      # Non-fatal: if it fails, Azure RBAC data is still refreshed and committed.
      - name: Pull Entra ID directory data
        id: entra
        continue-on-error: true
        run: |
          bash scripts/sync-entra.sh
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build processed data
        run: |
          node scripts/build-data.js
          if [ -f data/raw/entra-roles-raw.json ] && [ -f data/raw/entra-resourceactions-raw.json ]; then
            node scripts/build-entra.js
          else
            echo "Entra raw data missing — skipping Entra build."
          fi

      - name: Check for changes
        id: changes
        run: |
          # --porcelain catches both modified tracked files and new (untracked) Entra files
          if [ -n "$(git status --porcelain public/data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/roles.json public/data/ui-structure.json \
                  public/data/operations-index.json public/data/metadata.json
          # Entra files only exist if the (optional) Entra build ran
          git add public/data/entra-*.json 2>/dev/null || true

          ROLES=$(python3 -c "import json; print(json.load(open('public/data/metadata.json'))['roleCount'])")
          OPS=$(python3 -c "import json; print(json.load(open('public/data/metadata.json'))['operationCount'])")

          git commit -m "data: sync Azure RBAC data ($ROLES roles, $OPS operations)"
          git push origin HEAD:main
